<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src workjournal-asset:; font-src 'none'; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><link rel="stylesheet" href="editor.css"><title>本地笔记编辑器</title></head><body>
<header><div class="modes"><div class="mode-switch" role="group" aria-label="编辑模式"><button id="document-mode" class="active">文档</button><button id="source-mode">Markdown</button></div><span id="status" role="status">本地编辑</span></div><div id="toolbar" role="toolbar" aria-label="文档格式"></div></header>
<div id="notice" role="alert" hidden></div><main><div id="document"></div><textarea id="source" aria-label="Markdown 源码" spellcheck="false" hidden></textarea></main><footer>切换模式后重新建立撤销历史 · ⌘S 保存 · ⌘点击打开链接 · 未识别语法以原文显示</footer>
<dialog id="link-dialog"><form method="dialog"><h3>编辑链接</h3><label>显示文字<input id="link-text" maxlength="2000"></label><label>地址<input id="link-url" placeholder="https:// 或 mailto:" maxlength="4096"></label><div class="actions"><button value="cancel">取消</button><button id="link-remove" value="remove">移除链接</button><button id="link-open" value="open">打开</button><button value="save">确定</button></div></form></dialog>
<dialog id="image-dialog"><form method="dialog"><h3>图片</h3><label>替代文本<input id="image-alt" maxlength="2000"></label><div class="actions"><button value="cancel">取消</button><button value="view">查看大图</button><button value="replace">替换</button><button value="remove">删除</button><button value="save">确定</button></div></form></dialog>
<script src="editor.js"></script></body></html>
